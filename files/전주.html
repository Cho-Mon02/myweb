<!doctype html>
<html lang="ko">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>추천 활동</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        :root {
            --jeonju-bg: #f7f0df;
            --jeonju-bg-deep: #d8c39a;
            --jeonju-accent: #7b4b32;
            --jeonju-ocean: #8b6b45;
            --jeonju-sand: #fbf7ed;
            --jeonju-text: #332b24;
        }

        body {
            background: linear-gradient(180deg, var(--jeonju-bg-deep) 0%, var(--jeonju-bg) 26%, var(--jeonju-sand) 100%);
            color: var(--jeonju-text);
        }

        .city-photo-band {
            margin-bottom: 0;
            position: relative;
            height: 25vh;
            min-height: 160px;
            box-sizing: border-box;
            overflow: hidden;
        }

        .city-photo {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .city-photo-title {
            position: relative;
            z-index: 1;
        }

        .flight-price {
            margin-top: 0;
        }

        .flight-price fieldset label {
            display: block;
            margin-bottom: 0.75rem;
        }

        .body {
            background: rgba(255, 255, 255, 0.42);
            backdrop-filter: blur(2px);
        }

        .rec {
            background: rgba(247, 241, 230, 0.96);
            border: 1px solid rgba(123, 75, 50, 0.2);
        }

        .thumb img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>

<body>
    <main class="screen">
        <!-- 도시 사진 영역 (화면 상단 1/4) -->
        <div class="band city-photo-band">
            <img src="전주.jpeg" alt="전주 대표 사진" class="city-photo">
            <a class="back" href="korea.html">← 이전</a>
            <div class="city-photo-title"><strong>전주</strong></div>
        </div>

        <div class="body">
            <section class="flight-price" aria-label="항공권 선택">
                <div>
                    <strong>부산 출발 · 전주 여행 교통편</strong>
                    <p>원하는 항공권을 선택해 주세요.</p>
                </div>
                <form action="#" method="get">
                    <fieldset>
                        <legend>항공권 선택</legend>
                        <label>
                            <input type="radio" name="flight" value="morning" required>
                            오전편 · 부산 08:30 출발 → 전주 도착 <strong class="price">₩47,000</strong>
                        </label>
                        <label>
                            <input type="radio" name="flight" value="afternoon">
                            오후편 · 부산 13:00 출발 → 전주 도착 <strong class="price">₩55,000</strong>
                        </label>
                        <label>
                            <input type="radio" name="flight" value="evening">
                            저녁편 · 부산 18:10 출발 → 전주 도착 <strong class="price">₩50,000</strong>
                        </label>
                    </fieldset>
                    <button type="submit">선택한 항공권 구매하기</button>
                </form>
            </section>

            <div>
                <h2>이런 활동은 어떠세요?</h2>
                <p class="sub">어디서 어떤 활동을 하면 좋을지 추천해 드려요.</p>
            </div>

            <!-- 한 행에 2개씩 (2×2) -->
            <div class="recs">
                <article class="rec">
                    <div class="thumb"><img src="전주한옥마을.jpg" alt="전주 활동 사진 1"></div>
                    <div>
                        <h3>전주한옥마을</h3><span class="tag">전통문화 명소</span>
                        <p>한옥 골목을 둘러보고 전통문화를 체험해 보세요.</p>
                    </div>
                </article>
                <article class="rec">
                    <div class="thumb"><img src="경기전.jpg" alt="전주 활동 사진 2"></div>
                    <div>
                        <h3>경기전</h3><span class="tag">역사 유적</span>
                        <p>경기전에서 조선 왕조의 역사와 전통 건축을 만나보세요.</p>
                    </div>
                </article>
                <article class="rec">
                    <div class="thumb"><img src="전동성당1.jpg" alt="전주 활동 사진 3"></div>
                    <div>
                        <h3>전동성당</h3><span class="tag">근대 건축 명소</span>
                        <p>전동성당의 아름다운 로마네스크 양식 건축을 감상해 보세요.</p>
                    </div>
                </article>
                <article class="rec">
                    <div class="thumb"><img src="전주남부시장.jpg" alt="전주 활동 사진 4"></div>
                    <div>
                        <h3>전주 남부시장</h3><span class="tag">전통시장</span>
                        <p>남부시장에서 전주비빔밥과 다양한 지역 먹거리를 맛보세요.</p>
                    </div>
                </article>
            </div>
        </div>
    </main>
</body>

</html>
