<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>산출물</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .image-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
            justify-items: center;
        }

        .image-grid img {
            max-width: 100%;
            height: auto;
        }
    </style>
</head>

<body>
    <h1>산출물</h1>
    <div class="image-grid">
        <img src="intro.png" alt="이미지 1">
        <img src="city.png" alt="이미지 2">
        <img src="rec.png" alt="이미지 3">
    </div>

</body>

</html>
