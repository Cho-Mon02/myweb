<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>마지막 한마디 — 전송 완료</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #000;
      --fg: #f4f1ec;
      --muted: rgba(244, 241, 236, .5);
      --line: rgba(244, 241, 236, .18);
      --c: #f2b866;
      color-scheme: dark;
      --serif: "Noto Serif KR", "Nanum Myeongjo", "Apple SD Gothic Neo", Batang, serif;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px)
    }

    @media (prefers-color-scheme:dark) {
      :root:not([data-theme="light"]) {
        --bg: #000;
        --fg: #f4f1ec
      }
    }

    :root[data-theme="dark"] {
      --bg: #000;
      --fg: #f4f1ec
    }

    html {
      scroll-padding-top: env(safe-area-inset-top, 0px)
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--fg);
      font-family: var(--serif)
    }

    * {
      box-sizing: border-box
    }

    header {
      padding: 20px 24px;
      font-weight: 600;
      font-size: 16px;
      letter-spacing: .04em
    }

    .steps {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      margin: 8px 24px 0;
      padding: 0;
      list-style: none
    }

    .steps li {
      font-size: 13px;
      color: var(--muted);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 7px 16px
    }

    .steps li.on {
      background: var(--fg);
      border-color: var(--fg);
      color: #000;
      font-weight: 600
    }

    main {
      max-width: 560px;
      margin: 0 auto;
      padding: clamp(48px, 11vh, 110px) 24px 72px;
      text-align: center
    }

    .ck {
      width: 96px;
      height: 96px;
      margin: 0 auto;
      filter: drop-shadow(0 0 26px color-mix(in srgb, var(--c) 40%, transparent))
    }

    .ck svg {
      width: 100%;
      height: 100%;
      fill: none;
      stroke: var(--c);
      stroke-width: 2.4;
      stroke-linecap: round;
      stroke-linejoin: round
    }

    .ck circle {
      stroke-dasharray: 252;
      stroke-dashoffset: 252;
      animation: draw 1s .1s ease forwards
    }

    .ck path {
      stroke-dasharray: 60;
      stroke-dashoffset: 60;
      animation: draw .5s .9s ease forwards
    }

    h1 {
      margin: 28px 0 0;
      font-weight: 600;
      font-size: clamp(30px, 6vw, 42px);
      letter-spacing: .04em
    }

    .msg {
      margin: 22px 0 0;
      font-size: clamp(16px, 3.6vw, 19px);
      line-height: 1.9;
      font-weight: 300;
      word-break: keep-all
    }

    .msg span {
      display: block
    }

    [hidden] {
      display: none !important
    }

    .chip {
      display: inline-block;
      margin-top: 26px;
      font-size: 13px;
      color: var(--c);
      border: 1px solid color-mix(in srgb, var(--c) 45%, transparent);
      background: color-mix(in srgb, var(--c) 10%, transparent);
      border-radius: 999px;
      padding: 8px 18px
    }

    .act {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 34px
    }

    .btn {
      font: 600 15px var(--serif);
      letter-spacing: .08em;
      text-decoration: none;
      padding: 14px 28px;
      border-radius: 12px;
      border: 1px solid var(--line);
      color: var(--fg);
      transition: border-color .25s, filter .25s
    }

    .btn:hover {
      border-color: var(--fg)
    }

    .btn.p {
      background: var(--c);
      border-color: var(--c);
      color: #000
    }

    .btn.p:hover {
      filter: brightness(1.12)
    }

    .btn:focus-visible {
      outline: 2px solid #fff;
      outline-offset: 3px
    }

    @keyframes draw {
      to {
        stroke-dashoffset: 0
      }
    }

    @media (prefers-reduced-motion:reduce) {

      .ck circle,
      .ck path {
        animation-duration: .01s;
        animation-delay: 0s
      }
    }
  </style>
</head>

<body>
  <header>마지막 한마디</header>
  <ol class="steps" aria-label="진행 단계">
    <li>① 카드 선택</li>
    <li>② 메시지 작성</li>
    <li class="on" aria-current="step">③ 전송 완료</li>
  </ol>
  <main>
    <div class="ck"><svg viewBox="0 0 100 100" aria-hidden="true">
        <circle cx="50" cy="50" r="40" />
        <path d="M32 52l13 13 24-28" />
      </svg></div>
    <h1>보내졌습니다</h1>
    <p class="msg"><span id="to">받는 분께</span><span>당신의 따뜻한 마지막 마음이 전달되었습니다.</span></p>
    <div class="chip" id="chip" hidden></div>
    <div class="act"><a class="btn" href="choice_card.html">다른 카드 보내기</a><a class="btn p" href="index.html">처음으로</a>
    </div>
  </main>
  <script>
    var NAMES = { thanks: '고마워', sorry: '미안해', love: '사랑해', forgive: '용서해줘', miss: '보고싶어', proud: '자랑스러워' };
    var COLORS = { thanks: '#f2b866', sorry: '#7ea6d8', love: '#e8708f', forgive: '#a794d6', miss: '#67c1bd', proud: '#f0955a' };
    var q = new URLSearchParams(location.hash.slice(1) || location.search), d = q.get('card') ? { card: q.get('card'), name: q.get('name') || '', email: q.get('email') || '' } : null;
    if (!d) { try { d = JSON.parse(sessionStorage.getItem('lastWord')) } catch (e) { } }
    if (d && NAMES[d.card]) {
      document.documentElement.style.setProperty('--c', COLORS[d.card]);
      var ch = document.getElementById('chip'); ch.textContent = '보낸 카드 · ' + NAMES[d.card]; ch.hidden = false;
      if (d.name && d.email) document.getElementById('to').textContent = d.name + '님(' + d.email + ')에게';
    }
  </script>
</body>

</html>
