<!DOCTYPE html>

    <link rel="stylesheet" href="css/style.css">

<body>
    <h1 style="font-family: 'DynaPuff', cursive;">고양이의 하루</h1>
    <div>
        <p>계속 잠을 잡니다</p>
    </div>
    <p>고양이는 매일 12~16시간 수면을 취합니다. 다만 깊게 자지 못하고, 거의 얕은 잠을 잡니다. 소리가 났을 때 곧바로 꺠어나는 것은 얕은 잠을 자기 때문입니다.</p>
    <div style=" font-size: 20px;">
        <span style="color : red; font-size :32px;">Hello CSS!</span> <!--변화 없음 고정된 크기라서 -->
        <span style="color : blue; font-size :2em;">Hello CSS!</span> <!--변화 있음 em 단위는 부모 요소의 글꼴 크기를 기준으로 함 -->
        <span style="font-family:'DynaPuff',cursive; color : orange; font-size :2rem;">Hello CSS!</span>
        <!-- 변화 없음 rem 단위는 루트 요소의 글꼴 크기를 기준으로 함 -->
    </div>
    <hr>
    <div id="parent">
        <div class="box" id="one">1</div>
        <div class="box" id="two">2</div>
        <div class="box" id="three">3</div>
        <div class="box" id="four">4</div>
    </div>
</body>

</html>
