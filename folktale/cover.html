<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>날씨 파는 소년 — 표지</title>
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Nanum+Pen+Script&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --paper: #f6eddc;
            --ink: #2b2a3a;
            --serif: "Gowun Batang", "Noto Serif KR", serif
        }

        * {
            box-sizing: border-box
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
            background: var(--paper);

            color: var(--ink);
            font-family: var(--serif)
        }

        .book {
            display: grid;
            grid-template-columns: 1fr;
            min-height: 100vh
        }

        .art {
            position: relative;
            min-height: 100vh;
            overflow: hidden;
            background: url("images/cover.png") center / cover no-repeat
        }

        .cover .art {
            grid-column: 1/-1
        }

        .cover .ttl {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding-top: 9vh;
            text-align: center;
            color: #fbeec2;
            text-shadow: 0 2px 18px #0a0e2a
        }

        .cover h1 {
            margin: 0;
            font-family: "Nanum Pen Script", cursive;
            font-weight: 400;
            font-size: clamp(64px, 11vw, 128px);
            line-height: 1
        }

        .cover .by {
            margin-top: 14px;
            font-size: 18px;
            letter-spacing: .3em
        }

        .cover .go {
            position: absolute;
            left: 50%;
            bottom: 6vh;
            transform: translateX(-50%);
            color: #fbeec2;
            border: 1px solid #fbeec2;
            border-radius: 999px;
            padding: 14px 38px;
            text-decoration: none;
            letter-spacing: .2em;
            background: #0f1535aa
        }

        .cover .go:hover {
            background: #fbeec2;
            color: #0f1535
        }

        @media (max-width: 600px) {
            .art {
                min-height: 100svh;
                background-position: center;
            }

            .cover .ttl {
                padding: 12vh 16px 0;
            }

            .cover h1 {
                font-size: clamp(48px, 13vw, 76px);
            }

            .cover .by {
                margin-top: 10px;
                font-size: 16px;
            }

            .cover .go {
                bottom: 5vh;
                padding: 12px 28px;
                font-size: 14px;
                white-space: nowrap;
            }
        }

        /* 그림 크기만큼만 차지하는 무대: 양쪽 끝 클릭 영역의 기준이 됨 */
        .stage {
            position: relative;
            display: block;
            max-width: 100%;
            line-height: 0
        }

        .stage img {
            display: block;
            height: 100vh;
            height: 100svh;
            width: auto;
            max-width: 100vw;
            object-fit: cover;
            object-position: center bottom
        }

        .art {
            background:
                linear-gradient(135deg, #263d59 0%, #3c536b 45%, #18253d 100%);
            display: flex;
            justify-content: center;
            align-items: flex-end;
        }
    </style>
</head>

<body class="cover">
    <main class="book">
        <div class="art">
            <div class="stage">
                <img src="images/cover.png" alt="">
                <a class="edge prev" rel="prev" href="cover.html" aria-label="이전 페이지">&#8249;</a>
                <a class="edge next" rel="next" href="page2.html" aria-label="다음 페이지">&#8250;</a>
            </div>
            <div class="ttl">
                <h1>날씨 파는 소년</h1>
                <div class="by">글 송혜미</div>
            </div><a class="go" rel="next" href="page1.html">책 펼치기</a>
        </div>
    </main>
</body>

</html>
