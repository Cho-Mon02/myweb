<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>날씨를 파는 소년 - 페이지1</title>
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Nanum+Pen+Script&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --paper: #f6eddc;
            --ink: #2b2a3a;
            --serif: "Gowun Batang", "Noto Serif KR", serif
        }

        * {
            box-sizing: border-box
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
            background: var(--paper);
            color: var(--ink);
            font-family: var(--serif)
        }

        .book {
            display: grid;
            grid-template-columns: 1fr;
            min-height: 100vh
        }

        .art {
            position: relative;
            min-height: 100vh;
            overflow: hidden
        }

        .cover .art {
            grid-column: 1/-1
        }

        .cover .ttl {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding-top: 9vh;
            text-align: center;
            color: black;
            text-shadow: 0 2px 18px #0a0e2a;
            pointer-events: none
        }

        .cover h1 {
            margin: 0;
            font-family: "Nanum Pen Script", cursive;
            font-weight: 400;
            font-size: clamp(64px, 11vw, 128px);
            line-height: 1
        }

        .cover .by {
            margin-top: 14px;
            font-size: 18px;
            letter-spacing: .3em
        }

        /* 하단 이전/다음 버튼 */
        .cover .nav {
            position: absolute;
            left: 50%;
            bottom: 6vh;
            transform: translateX(-50%);
            display: flex;
            gap: 14px;
            z-index: 10
        }

        .cover .go {
            color: #fbeec2;
            border: 1px solid #fbeec2;
            border-radius: 999px;
            padding: 14px 38px;
            text-decoration: none;
            letter-spacing: .2em;
            background: #0f1535aa;
            white-space: nowrap
        }

        .cover .go:hover,
        .cover .go:focus-visible {
            background: #fbeec2;
            color: #0f1535
        }

        /* 책의 양쪽 끝: 클릭하면 이전/다음 페이지로 이동 */
        .edge {
            position: absolute;
            top: 0;
            bottom: 0;
            width: clamp(56px, 12%, 140px);
            z-index: 5;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fbeec2;
            font-size: 44px;
            text-decoration: none;
            opacity: 0;
            transition: opacity .2s
        }

        .edge.prev {
            left: 0;
            background: linear-gradient(to right, #0f153566, transparent)
        }

        .edge.next {
            right: 0;
            background: linear-gradient(to left, #0f153566, transparent)
        }

        .edge:hover,
        .edge:focus-visible {
            opacity: 1;
            outline: none
        }

        /* 터치 화면은 hover가 없으므로 화살표를 은은하게 항상 표시 */
        @media (hover: none) {
            .edge {
                opacity: .45
            }
        }

        @media (max-width: 600px) {
            .art {
                min-height: 100svh;
                background-position: center;
            }

            .cover .ttl {
                padding: 12vh 16px 0;
            }

            .cover h1 {
                font-size: clamp(48px, 13vw, 76px);
            }

            .cover .by {
                margin-top: 10px;
                font-size: 16px;
            }

            .cover .nav {
                bottom: 5vh;
                gap: 10px;
            }

            .cover .go {
                padding: 12px 22px;
                font-size: 14px;
            }
        }

        .art {
            background: linear-gradient(#8fc1ee 0%, #fbe3b8 60%, #ecd09a 63%);
            display: flex;
            justify-content: center;
            align-items: flex-end;
        }

        /* 그림 크기만큼만 차지하는 무대: 양쪽 끝 클릭 영역의 기준이 됨 */
        .stage {
            position: relative;
            display: block;
            max-width: 100%;
            line-height: 0
        }

        .stage img {
            display: block;
            height: 100vh;
            height: 100svh;
            width: auto;
            max-width: 100vw;
            object-fit: cover;
            object-position: center bottom
        }
    </style>
</head>

<body class="cover">
    <main class="book">
        <div class="art">
            <!-- 배경 그림 + 그림의 양쪽 끝 클릭 영역 -->
            <div class="stage">
                <img src="images/market_selling.png" alt="">
                <a class="edge prev" rel="prev" href="cover.html" aria-label="이전 페이지">&#8249;</a>
                <a class="edge next" rel="next" href="page2.html" aria-label="다음 페이지">&#8250;</a>
            </div>

            <div class="ttl"><br>
                <br>

                <p>살랑살랑 바람이 불어오던 날, 파아란 모자가 잘 어울리는 소년은 오늘도 장터로 향했어요.<br>
                    소년은 금빛 갈대숲을 지나며 이런 생각을 했어요. 지난 이틀 동안 운이 참 좋았다고요.</p><br>
                <br>
                <br>
                <br>
                <br>

                <p>소년은 어제도, 그제도 날씨를 팔았어요. 어제는 가랑비를, 그제는 뭉게구름을 팔았지요. <br>
                    가랑비는 장미꽃을 키우는 아주머니가 사갔고 뭉게구름은 구름을 한 번도 본 적 없는 화가가 사갔어요.<br>
                    그들은 한 손에 날씨를 쥐고 웃으며 집으로 돌아갔어요. 소년은 그들의 만족스런 얼굴을 떠올리다, 문득 미소 지었어요.</p>
            </div>

            <!-- 하단 버튼 -->
            <div class="nav">
                <a class="go" rel="prev" href="cover.html">이전 페이지</a>
                <a class="go" rel="next" href="page2.html">다음 페이지</a>
            </div>
        </div>
    </main>
</body>

</html>
