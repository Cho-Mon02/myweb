<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 1200" width="1000" height="1200" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1840"/>
      <stop offset="0.55" stop-color="#26356c"/>
      <stop offset="1" stop-color="#4a5a96"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a62a0"/>
      <stop offset="1" stop-color="#1f3d70"/>
    </linearGradient>
    <radialGradient id="glowY" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff2a0" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ffd84a" stop-opacity="0"/>
    </radialGradient>

    <!-- 별 (반지름 1) -->
    <polygon id="star" points="0,-1 0.2645,-0.364 0.9511,-0.309 0.428,0.139 0.5878,0.809 0,0.45 -0.5878,0.809 -0.428,0.139 -0.9511,-0.309 -0.2645,-0.364" fill="#ffd84a" stroke="#ffb81f" stroke-width="0.08" stroke-linejoin="round"/>

    <!-- 똥 (귀엽게 단순화) -->
    <g id="poop">
      <ellipse cx="0" cy="6" rx="16" ry="9" fill="#7a4a2a"/>
      <ellipse cx="0" cy="-4" rx="12" ry="8" fill="#8a5530"/>
      <ellipse cx="0" cy="-12" rx="7" ry="6" fill="#9a6238"/>
      <path d="M0 -20 Q6 -15 2 -12Z" fill="#9a6238"/>
      <ellipse cx="-6" cy="-6" rx="3" ry="2" fill="#ffffff" opacity="0.3"/>
    </g>

    <!-- 하늘을 나는 거북이 (오른쪽을 보고 있음, 중심 0,0) -->
    <g id="turtle">
      <path d="M-86 18 Q-112 22 -118 38 Q-100 38 -84 30Z" fill="#7fae6c"/>
      <path d="M-50 28 Q-88 74 -124 64 Q-92 32 -62 12Z" fill="#7fae6c"/>
      <path d="M-20 34 Q-40 78 -70 78 Q-50 44 -30 22Z" fill="#6f9e5c"/>
      <ellipse cx="0" cy="34" rx="84" ry="20" fill="#d9c48a"/>
      <ellipse cx="0" cy="0" rx="95" ry="62" fill="#4f8f6a"/>
      <path d="M-95 6 Q0 62 95 6" fill="none" stroke="#35684b" stroke-width="5"/>
      <g fill="none" stroke="#35684b" stroke-width="4" stroke-linejoin="round">
        <polygon points="-18,-34 18,-34 30,-4 0,14 -30,-4"/>
        <path d="M-18 -34 L-34 -52 M18 -34 L34 -52 M30 -4 L62 -8 M-30 -4 L-62 -8 M0 14 L0 38"/>
      </g>
      <ellipse cx="-30" cy="-30" rx="14" ry="8" fill="#ffffff" opacity="0.18" transform="rotate(-25 -30 -30)"/>
      <ellipse cx="96" cy="14" rx="26" ry="17" fill="#8fbf7a"/>
      <circle cx="118" cy="6" r="26" fill="#8fbf7a"/>
      <circle cx="128" cy="0" r="4.5" fill="#2b2a3a"/>
      <circle cx="129.5" cy="-1.5" r="1.5" fill="#ffffff"/>
      <circle cx="122" cy="16" r="6" fill="#f0a08a" opacity="0.5"/>
      <path d="M126 16 Q134 20 140 14" stroke="#2b2a3a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <path d="M26 20 Q56 -86 134 -80 Q86 -22 54 30Z" fill="#9ccf86"/>
      <path d="M44 4 Q72 -52 108 -64" stroke="#7fae6c" stroke-width="3" fill="none" stroke-linecap="round"/>
    </g>
  </defs>

  <!-- 별 하나 없는 밤하늘 -->
  <rect width="1000" height="1200" fill="url(#night)"/>
  <g fill="#3a4a86" opacity="0.5">
    <ellipse cx="760" cy="200" rx="110" ry="22"/>
    <ellipse cx="820" cy="184" rx="60" ry="22"/>
    <ellipse cx="560" cy="440" rx="80" ry="16"/>
    <ellipse cx="120" cy="560" rx="90" ry="18"/>
  </g>

  <!-- 바다 (오른쪽) -->
  <rect x="640" y="800" width="360" height="300" fill="url(#sea)"/>
  <g stroke="#9fc0e8" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6">
    <path d="M700 830 q14 -8 28 0 t28 0"/>
    <path d="M820 850 q14 -8 28 0 t28 0"/>
    <path d="M900 900 q14 -8 28 0 t28 0"/>
    <path d="M740 930 q14 -8 28 0 t28 0"/>
  </g>

  <!-- 먼 언덕과 나무가 서 있는 언덕 -->
  <path d="M0 820 Q220 770 440 850 T780 890 L780 1200 L0 1200Z" fill="#1d3b4c"/>

  <!-- 앞쪽 땅 -->
  <path d="M0 990 Q260 950 520 1010 Q780 1060 1000 1010 L1000 1200 L0 1200Z" fill="#27505a"/>
  <path d="M0 990 Q260 950 520 1010 Q780 1060 1000 1010 L1000 1026 Q780 1076 520 1026 Q260 966 0 1006Z" fill="#3a6a6a" opacity="0.6"/>

  <!-- 언덕에서 아래쪽 땅으로 이어지는 길 -->
  <path d="M270 860 C330 920 330 990 420 1060 S520 1150 540 1200" stroke="#8a8a7a" stroke-width="46" fill="none" stroke-linecap="round" opacity="0.35"/>

  <!-- 작은 집 (소년이 돌아온 곳) -->
  <g>
    <rect x="60" y="1020" width="130" height="90" fill="#6a5a50"/>
    <path d="M48 1022 L125 962 L202 1022Z" fill="#8a4a44"/>
    <rect x="95" y="1048" width="30" height="34" fill="#ffd36a"/>
    <rect x="140" y="1048" width="26" height="34" fill="#ffd36a"/>
    <path d="M110 1048 v34 M95 1065 h30" stroke="#6a5a50" stroke-width="3"/>
  </g>

  <!-- ========== 왼쪽 위 장면: 나무 위에서 고민하는 소년 ========== -->
  <!-- 잎 -->
  <g fill="#1f4a46">
    <circle cx="80" cy="300" r="125"/>
    <circle cx="200" cy="190" r="95"/>
    <circle cx="60" cy="170" r="90"/>
    <circle cx="180" cy="330" r="80"/>
  </g>
  <g fill="#2e6a5e" opacity="0.7">
    <circle cx="150" cy="170" r="14"/>
    <circle cx="60" cy="260" r="12"/>
    <circle cx="200" cy="300" r="12"/>
    <circle cx="110" cy="330" r="10"/>
  </g>
  <!-- 줄기와 가지 -->
  <path d="M150 840 Q165 640 175 400 L240 400 Q240 640 270 840Z" fill="#3a2e34"/>
  <path d="M175 440 Q175 560 160 700" stroke="#4d3d44" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.8"/>
  <path d="M215 450 Q300 436 410 430" stroke="#3a2e34" stroke-width="28" fill="none" stroke-linecap="round"/>
  <path d="M215 436 Q300 422 410 417" stroke="#4d3d44" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.8"/>

  <!-- 나뭇가지에 앉은 소년 -->
  <g transform="translate(330 428) scale(0.7)">
    <!-- 늘어뜨린 다리 -->
    <rect x="-34" y="-12" width="22" height="72" rx="8" fill="#3b3a55"/>
    <rect x="6" y="-12" width="22" height="72" rx="8" fill="#3b3a55"/>
    <ellipse cx="-20" cy="64" rx="22" ry="10" fill="#2b2a3a"/>
    <ellipse cx="20" cy="64" rx="22" ry="10" fill="#2b2a3a"/>
    <!-- 몸 -->
    <rect x="-50" y="-150" width="100" height="150" rx="30" fill="#e8b86a"/>
    <path d="M-35 -90 Q0 -70 35 -90" stroke="#c99a4e" stroke-width="4" fill="none" stroke-linecap="round"/>
    <!-- 아래로 늘어뜨린 팔(빈 손) -->
    <path d="M-40 -125 L-54 -52" stroke="#e8b86a" stroke-width="22" stroke-linecap="round"/>
    <circle cx="-55" cy="-44" r="12" fill="#f6d2ac"/>
    <!-- 머리 -->
    <circle cx="0" cy="-205" r="46" fill="#f6d2ac"/>
    <circle cx="-19" cy="-172" r="8" fill="#f0a08a" opacity="0.45"/>
    <circle cx="19" cy="-172" r="8" fill="#f0a08a" opacity="0.45"/>
    <!-- 모자 -->
    <path d="M-52 -215 Q0 -325 52 -215Z" fill="#2a63c9"/>
    <ellipse cx="0" cy="-213" rx="66" ry="13" fill="#1f4fa8"/>
    <path d="M-35 -250 Q-15 -282 10 -288" stroke="#5b8de0" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.7"/>
    <!-- 고민하는 얼굴 -->
    <circle cx="-14" cy="-184" r="4" fill="#2b2a3a"/>
    <circle cx="16" cy="-184" r="4" fill="#2b2a3a"/>
    <path d="M-27 -193 L-9 -199 M9 -199 L27 -193" stroke="#2b2a3a" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M-10 -166 q5 -5 10 0 q5 5 10 0" stroke="#2b2a3a" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- 턱을 괸 팔 -->
    <path d="M40 -125 L62 -78 L30 -160" stroke="#e8b86a" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="26" cy="-165" r="13" fill="#f6d2ac"/>
  </g>

  <!-- 생각 풍선: 물음표 -->
  <g>
    <circle cx="392" cy="290" r="6" fill="#ffffff" opacity="0.92"/>
    <circle cx="412" cy="262" r="10" fill="#ffffff" opacity="0.92"/>
    <ellipse cx="510" cy="200" rx="108" ry="72" fill="#ffffff" opacity="0.94"/>
    <path d="M482 172 Q482 140 512 140 Q542 140 542 168 Q542 188 512 204 L512 224" stroke="#2c3a72" stroke-width="11" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="512" cy="250" r="8" fill="#2c3a72"/>
  </g>

  <!-- ========== 오른쪽 아래 장면: 거북이와 세 개의 별 ========== -->
  <!-- 하늘을 나는 거북이 -->
  <g transform="translate(640 640) rotate(8) scale(0.8)">
    <use href="#turtle" xlink:href="#turtle"/>
  </g>
  <!-- 거북이의 소원 풍선 -->
  <g>
    <circle cx="752" cy="618" r="4" fill="#ffffff" opacity="0.92"/>
    <circle cx="768" cy="596" r="7" fill="#ffffff" opacity="0.92"/>
    <ellipse cx="810" cy="540" rx="60" ry="42" fill="#ffffff" opacity="0.94"/>
    <path d="M810 562 C776 538 788 512 810 528 C832 512 844 538 810 562Z" fill="#f06a8a"/>
  </g>
  <!-- 떨어지는 똥 -->
  <g stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.55">
    <path d="M540 676v22M512 724v22M566 700v16"/>
  </g>
  <use href="#poop" xlink:href="#poop" transform="translate(538 722)"/>
  <use href="#poop" xlink:href="#poop" transform="translate(510 776) scale(0.85)"/>

  <!-- 소년 -->
  <g transform="translate(470 1100) scale(0.9)">
    <ellipse cx="0" cy="3" rx="75" ry="12" fill="#0d1a24" opacity="0.35"/>

    <!-- 반짝이는 세 개의 별 -->
    <circle cx="-120" cy="-340" r="46" fill="url(#glowY)"/>
    <circle cx="-80" cy="-385" r="64" fill="url(#glowY)"/>
    <circle cx="-35" cy="-405" r="46" fill="url(#glowY)"/>
    <use href="#star" xlink:href="#star" transform="translate(-120 -340) scale(20)"/>
    <use href="#star" xlink:href="#star" transform="translate(-80 -385) scale(28)"/>
    <use href="#star" xlink:href="#star" transform="translate(-35 -405) scale(20)"/>

    <!-- 다리 -->
    <rect x="-30" y="-70" width="22" height="64" rx="8" fill="#3b3a55"/>
    <rect x="8" y="-70" width="22" height="64" rx="8" fill="#3b3a55"/>
    <ellipse cx="-21" cy="-2" rx="20" ry="9" fill="#2b2a3a"/>
    <ellipse cx="21" cy="-2" rx="20" ry="9" fill="#2b2a3a"/>
    <!-- 몸 -->
    <rect x="-50" y="-210" width="100" height="150" rx="30" fill="#e8b86a"/>
    <path d="M-35 -140 Q0 -120 35 -140" stroke="#c99a4e" stroke-width="4" fill="none" stroke-linecap="round"/>
    <!-- 머리 -->
    <circle cx="0" cy="-255" r="46" fill="#f6d2ac"/>
    <circle cx="-19" cy="-235" r="8" fill="#f0a08a" opacity="0.5"/>
    <circle cx="19" cy="-235" r="8" fill="#f0a08a" opacity="0.5"/>
    <!-- 모자 -->
    <path d="M-52 -265 Q0 -375 52 -265Z" fill="#2a63c9"/>
    <ellipse cx="0" cy="-263" rx="66" ry="13" fill="#1f4fa8"/>
    <path d="M-35 -300 Q-15 -332 10 -338" stroke="#5b8de0" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.7"/>
    <!-- 기쁜 얼굴 -->
    <path d="M-18 -243 q6 -8 12 0 M10 -243 q6 -8 12 0" stroke="#2b2a3a" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <ellipse cx="2" cy="-222" rx="9" ry="8" fill="#8a3b3b"/>
    <!-- 헝겊을 든 팔 (별 쪽) -->
    <path d="M-40 -180 L-80 -298" stroke="#e8b86a" stroke-width="24" stroke-linecap="round"/>
    <ellipse cx="-80" cy="-310" rx="20" ry="11" fill="#f6eddc" transform="rotate(-20 -80 -310)"/>
    <circle cx="-80" cy="-298" r="13" fill="#f6d2ac"/>
    <!-- 거북이에게 손 흔드는 팔 -->
    <path d="M40 -182 L78 -300" stroke="#e8b86a" stroke-width="24" stroke-linecap="round"/>
    <circle cx="80" cy="-306" r="13" fill="#f6d2ac"/>
    <!-- 외치는 소리 표시 -->
    <g stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.7" fill="none">
      <path d="M118 -345 q14 -6 26 -18"/>
      <path d="M126 -318 q22 -6 38 -22"/>
    </g>
  </g>
</svg>
